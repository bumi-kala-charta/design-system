</head><body><div class="row" style="border-radius:var(--radius-md);overflow:hidden"><div class="sw" style="background:var(--neutral-0);color:var(--neutral-800)"><b>0</b><span></span></div><div class="sw" style="background:var(--neutral-50);color:var(--neutral-800)"><b>50</b><span></span></div><div class="sw" style="background:var(--neutral-100);color:var(--neutral-800)"><b>100</b><span></span></div><div class="sw" style="background:var(--neutral-150);color:var(--neutral-800)"><b>150</b><span></span></div><div class="sw" style="background:var(--neutral-200);color:var(--neutral-800)"><b>200</b><span></span></div><div class="sw" style="background:var(--neutral-300);color:var(--neutral-800)"><b>300</b><span></span></div><div class="sw" style="background:var(--neutral-400);color:#fff"><b>400</b><span></span></div><div class="sw" style="background:var(--neutral-500);color:#fff"><b>500</b><span></span></div><div class="sw" style="background:var(--neutral-600);color:#fff"><b>600</b><span></span></div><div class="sw" style="background:var(--neutral-700);color:#fff"><b>700</b><span></span></div><div class="sw" style="background:var(--neutral-800);color:#fff"><b>800</b><span></span></div><div class="sw" style="background:var(--neutral-900);color:#fff"><b>900</b><span></span></div><div class="sw" style="background:var(--neutral-950);color:#fff"><b>950</b><span></span></div></div></body></html>
