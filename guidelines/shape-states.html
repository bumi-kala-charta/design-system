<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:74px}.sw b{font-family:var(--font-data);font-size:9.5px;letter-spacing:.06em;display:block}.sw span{font-family:var(--font-data);font-size:9px;opacity:.7;display:block;margin-top:2px}.k{font-family:var(--font-data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle)}</style>
</head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<div style="text-align:center"><div style="background:var(--action-primary);color:#fff;padding:13px 24px;border-radius:999px;font-size:15px;font-weight:500">Jadi anggota</div><div class="k" style="margin-top:8px">Rest</div></div><div style="text-align:center"><div style="background:var(--action-primary-hover);color:#fff;padding:13px 24px;border-radius:999px;font-size:15px;font-weight:500">Jadi anggota</div><div class="k" style="margin-top:8px">Hover</div></div><div style="text-align:center"><div style="background:var(--action-primary-press);color:#fff;padding:13px 24px;border-radius:999px;font-size:15px;font-weight:500">Jadi anggota</div><div class="k" style="margin-top:8px">Press</div></div>
<div style="width:1px;height:56px;background:var(--border-subtle);margin:0 6px"></div>
<div style="text-align:center"><div style="width:120px;height:56px;border:1px solid var(--border-subtle);border-radius:var(--radius-card)"></div><div class="k" style="margin-top:8px">Card rest</div></div>
<div style="text-align:center"><div style="width:120px;height:56px;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);transform:translateY(-3px)"></div><div class="k" style="margin-top:11px">Card hover</div></div>
</div>
<div class="k" style="margin-top:14px">Easing cubic-bezier(.2,0,0,1) · 120ms colour · 180ms transform · no bounce, ever</div></body></html>
