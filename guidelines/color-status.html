<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Success, warning, danger, info — soft fill + solid pair" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:74px}.sw b{font-family:var(--font-data);font-size:9.5px;letter-spacing:.06em;display:block}.sw span{font-family:var(--font-data);font-size:9px;opacity:.7;display:block;margin-top:2px}.k{font-family:var(--font-data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--status-success)"></div><div style="background:var(--status-success-soft);padding:10px 12px"><b style="font-family:var(--font-data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--status-success)">Berhasil</b><div class="k" style="margin-top:4px">--status-success</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--status-warning)"></div><div style="background:var(--status-warning-soft);padding:10px 12px"><b style="font-family:var(--font-data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--status-warning)">Perlu revisi</b><div class="k" style="margin-top:4px">--status-warning</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--status-danger)"></div><div style="background:var(--status-danger-soft);padding:10px 12px"><b style="font-family:var(--font-data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--status-danger)">Terhenti</b><div class="k" style="margin-top:4px">--status-danger</div></div></div><div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:34px;background:var(--status-info)"></div><div style="background:var(--status-info-soft);padding:10px 12px"><b style="font-family:var(--font-data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--status-info)">Informasi</b><div class="k" style="margin-top:4px">--status-info</div></div></div>
</div></body></html>
