<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — surface" subtitle="Page, sunken, card, brand, accent, dark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:0;align-items:stretch}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:74px}.sw b{font-family:var(--font-data);font-size:9.5px;letter-spacing:.06em;display:block}.sw span{font-family:var(--font-data);font-size:9px;opacity:.7;display:block;margin-top:2px}.k{font-family:var(--font-data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
<div style="background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:96px;display:flex;align-items:flex-end;padding:10px"><span style="font-family:var(--font-data);font-size:8.5px;letter-spacing:.04em;color:var(--text-default);word-break:break-all">--surface-page</span></div><div style="background:var(--surface-sunken);border:none;border-radius:var(--radius-md);height:96px;display:flex;align-items:flex-end;padding:10px"><span style="font-family:var(--font-data);font-size:8.5px;letter-spacing:.04em;color:var(--text-default);word-break:break-all">--surface-sunken</span></div><div style="background:var(--surface-card-muted);border:none;border-radius:var(--radius-md);height:96px;display:flex;align-items:flex-end;padding:10px"><span style="font-family:var(--font-data);font-size:8.5px;letter-spacing:.04em;color:var(--text-default);word-break:break-all">--surface-card-muted</span></div><div style="background:var(--surface-brand);border:none;border-radius:var(--radius-md);height:96px;display:flex;align-items:flex-end;padding:10px"><span style="font-family:var(--font-data);font-size:8.5px;letter-spacing:.04em;color:#fff;word-break:break-all">--surface-brand</span></div><div style="background:var(--surface-accent);border:none;border-radius:var(--radius-md);height:96px;display:flex;align-items:flex-end;padding:10px"><span style="font-family:var(--font-data);font-size:8.5px;letter-spacing:.04em;color:#fff;word-break:break-all">--surface-accent</span></div><div style="background:var(--surface-dark);border:none;border-radius:var(--radius-md);height:96px;display:flex;align-items:flex-end;padding:10px"><span style="font-family:var(--font-data);font-size:8.5px;letter-spacing:.04em;color:#fff;word-break:break-all">--surface-dark</span></div>
</div></body></html>
