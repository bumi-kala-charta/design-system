<!-- @dsCard group="Spacing" viewport="700x220" name="Glass" subtitle="5px frosted glass — only over maps, photos, or the green contour field" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--surface-page)}.row{display:flex;gap:16px}.col{flex:1}.bg{position:relative;flex:1;height:150px;border-radius:var(--radius-lg);overflow:hidden;display:flex;align-items:flex-end;padding:12px}.bg .bkc-contour{inset:0}.g{position:relative;width:100%;padding:10px 12px;border-radius:var(--radius-md);font-family:var(--font-data);font-size:10px;letter-spacing:.04em;color:var(--text-strong)}.g b{display:block;font-size:9.5px;letter-spacing:.06em}.g span{display:block;opacity:.75;margin-top:2px}.map{background:#E6ECE3}.map i{position:absolute;border:1.5px solid var(--bkc-green);background:rgba(53,140,103,.32);width:70px;height:54px;transform:rotate(-4deg)}.photo{background:radial-gradient(60% 80% at 25% 30%,#C9B48E,transparent 60%),radial-gradient(50% 60% at 80% 70%,#7E9A6C,transparent 65%),linear-gradient(160deg,#B7A27C,#5E6F52)}.k{font-family:var(--font-data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);margin-top:10px;text-align:center}</style>
</head><body><div class="row">
<div class="col"><div class="bg map"><span class="bkc-contour" data-pattern-tone="light" data-pattern-density="dense"></span><i style="left:24px;top:22px"></i><i style="left:110px;top:44px;background:rgba(53,140,103,.55)"></i><div class="g bkc-glass"><b>LIGHT</b><span>−6,9175 · 107,6191</span></div></div><div class="k">default · peta</div></div>
<div class="col"><div class="bg" style="background:var(--surface-brand)"><span class="bkc-contour" data-pattern-density="dense"></span><div class="g bkc-glass" data-glass="brand" style="color:#fff"><b>BRAND</b><span>1.204 bidang</span></div></div><div class="k">data-glass="brand"</div></div>
<div class="col"><div class="bg photo"><div class="g bkc-glass" data-glass="ink" style="color:#fff"><b>INK</b><span>Placeholder foto</span></div></div><div class="k">data-glass="ink" · foto</div></div>
</div></body></html>
