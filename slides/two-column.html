<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--surface-page)}
